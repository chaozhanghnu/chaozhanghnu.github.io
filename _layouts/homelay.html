---
layout: default
---

<link href="https://chaozhanghnu.github.io/css/main.scss" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/jquery@1.12.4/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"></script>

<style>
  #myCarousel .carousel-video {
    display: block;
    width: 100%;
    height: auto;
    background: #000;
  }
</style>

<div id="homeid" class="col-sm-12">
  <h1></h1>

  <div id="myCarousel" class="carousel slide">
    <!-- 轮播（Carousel）指标 -->
    <ol class="carousel-indicators">
      <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
      <li data-target="#myCarousel" data-slide-to="1"></li>
      <li data-target="#myCarousel" data-slide-to="2"></li>
      <li data-target="#myCarousel" data-slide-to="3"></li>
      <li data-target="#myCarousel" data-slide-to="4"></li>
      <li data-target="#myCarousel" data-slide-to="5"></li>
    </ol>

    <!-- 轮播（Carousel）项目 -->
    <div class="carousel-inner">
      <!-- 第一张照片 -->
      <div class="item active">
        <img src="https://chaozhanghnu.github.io/images/slides-lq/home-lq-2.jpg" alt="First slide">
        <div class="carousel-caption"></div>
      </div>

      <!-- 视频 1 -->
      <div class="item">
        <video class="carousel-video" muted playsinline preload="metadata">
          <source src="{{ '/videos/home-video-1.mp4' | relative_url }}" type="video/mp4">
          您的浏览器不支持视频播放。
        </video>
      </div>

      <!-- 视频 2 -->
      <div class="item">
        <video class="carousel-video" muted playsinline preload="metadata">
          <source src="{{ '/videos/home-video-2.mp4' | relative_url }}" type="video/mp4">
          您的浏览器不支持视频播放。
        </video>
      </div>

      <!-- 后面的照片 -->
      <div class="item">
        <img src="https://chaozhanghnu.github.io/images/slides-lq/direction1-2024-min.png" alt="Second slide">
        <div class="carousel-caption"></div>
      </div>

      <div class="item">
        <img src="https://chaozhanghnu.github.io/images/slides-lq/d2-0330-min.png" alt="Third slide">
        <div class="carousel-caption"></div>
      </div>

      <div class="item">
        <img src="https://chaozhanghnu.github.io/images/slides-lq/direction3-lq.png" alt="Fourth slide">
        <div class="carousel-caption"></div>
      </div>
    </div>

    <!-- 轮播（Carousel）导航 -->
    <a class="left carousel-control" href="#myCarousel" role="button" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left" aria-hidden="true"></span>
      <span class="sr-only">Previous</span>
    </a>

    <a class="right carousel-control" href="#myCarousel" role="button" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>

  {{ content }}
</div>

<script>
  $(function () {
    var $carousel = $('#myCarousel');

    // 普通照片每 5 秒自动切换。
    $carousel.carousel({
      interval: 5000,
      pause: 'hover',
      wrap: true
    });

    function handleActiveSlide() {
      var activeVideo = $carousel.find('.item.active video').get(0);

      // 停止并重置所有非当前视频。
      $carousel.find('video').each(function () {
        if (this !== activeVideo) {
          this.pause();
          this.currentTime = 0;
        }
      });

      if (activeVideo) {
        // 当前轮播项是视频：暂停轮播，播放完整视频。
        $carousel.carousel('pause');
        activeVideo.currentTime = 0;

        var playPromise = activeVideo.play();
        if (playPromise !== undefined) {
          playPromise.catch(function () {
            // 如果浏览器阻止自动播放，则恢复普通轮播。
            $carousel.carousel('cycle');
          });
        }
      } else {
        // 当前轮播项是照片：恢复自动轮播。
        $carousel.carousel('cycle');
      }
    }

    // 每次切换结束后，判断当前轮播项是照片还是视频。
    $carousel.on('slid.bs.carousel', handleActiveSlide);

    // 当前视频播放完毕后，自动切换到下一项。
    $carousel.find('video').on('ended', function () {
      $carousel.carousel('next');
    });

    handleActiveSlide();
  });
</script>
